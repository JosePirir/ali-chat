<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Twitch Chat Overlay</title>
  <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
  <style>
    /* Fuentes locales (carpeta ./fuentes junto a este archivo) */
    @font-face {
      font-family: 'Glacial Indifference';
      src: url('fuentes/GlacialIndifference-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'Glacial Indifference';
      src: url('fuentes/GlacialIndifference-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'Nyght Serif';
      src: url('fuentes/NyghtSerif-Dark.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      width: 460px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px 20px;
    }

    /* ===== CHAT ===== */

    #chat-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: visible;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .msg-wrapper.fade-out {
      animation: fadeOut 0.35s ease-in forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.88) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-6px); }
    }

    .username-label {
      font-family: 'Glacial Indifference', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #ccc5d3;
      /* alinea la estrella con el borde izquierdo del globo (rail 8px + gap 10px) */
      margin-left: 18px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.01em;
    }

    .username-label .name-star {
      color: #e8b979;
      font-size: 26px;
      line-height: 1;
    }

    .badges img {
      width: 16px;
      height: 16px;
      vertical-align: middle;
    }

    .bubble-row {
      display: flex;
      align-items: stretch;
      gap: 10px;
    }

    .rail {
      position: relative;
      width: 8px;
      flex-shrink: 0;
    }

    /* la línea arranca bajo los puntos y llega hasta el final del globo */
    .rail .rail-line {
      position: absolute;
      left: 2px;
      top: 20px;
      bottom: 0;
      width: 2px;
      background: #e8b979;
      border-radius: 1px;
    }

    /* los puntos arrancan justo al inicio del globo */
    .rail .rail-dot {
      position: absolute;
      left: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e8b979;
    }

    .rail .rail-dot:nth-child(1) { top: 1px; }
    .rail .rail-dot:nth-child(2) { top: 10px; opacity: 0.7; }

    .bubble-wrap {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .bubble {
      position: relative;
      background: linear-gradient(135deg, rgba(88, 75, 139, 0.25), rgba(161, 113, 158, 0.25));
      border: 1.5px solid rgba(232, 185, 121, 0.45);
      border-radius: 0;
      padding: 12px 16px;
      max-width: 400px;
    }

    .msg-text {
      font-family: 'Glacial Indifference', sans-serif;
      font-weight: 400;
      font-size: 18px;
      color: #ccc5d3;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg-text img.emote {
      width: 26px;
      height: 26px;
      vertical-align: middle;
      margin: 0 1px;
    }

    /* ===== ALERTAS (followers, subs, bits, raids) ===== */

    #alert-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: visible;
      margin-bottom: 6px;
    }

    .alert-wrapper {
      position: relative;
      /* espacio para las nubes que sobresalen arriba y abajo */
      padding: 44px 0 38px;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      flex-shrink: 0;
    }

    .alert-wrapper.fade-out {
      animation: fadeOut 0.4s ease-in forwards;
    }

    /* caja sin sesgar: sirve de referencia para texto y decoraciones.
       La altura es fija para poder calcular con exactitud dónde caen los
       vértices del paralelogramo: desplazamiento = alto * tan(38deg) = 0.781 * alto,
       y como el sesgo es respecto al centro, cada vértice se corre 0.3906 * alto. */
    .alert-shape {
      position: relative;
      width: 83%;
      height: 60px;
      margin: 0 auto;
    }

    /* solo el fondo va sesgado, así el borde dorado recorre los 4 lados */
    .alert-skew {
      position: absolute;
      inset: 0;
      transform: skewX(-38deg);
      background: linear-gradient(105deg, rgba(88, 75, 139, 0.7), rgba(161, 113, 158, 0.7));
      border: 1.5px solid #e8b979;
      z-index: 1;
    }

    .alert-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 16px;
      text-align: center;
    }

    .alert-title {
      font-family: 'Nyght Serif', serif;
      font-weight: 400;
      font-size: 18px;
      letter-spacing: 0.09em;
      color: #f4ead9;
      line-height: 1.1;
    }

    .alert-divider {
      width: 62%;
      height: 1px;
      background: #e8b979;
      margin: 6px auto;
    }

    .alert-user {
      font-family: 'Glacial Indifference', sans-serif;
      font-style: italic;
      font-weight: 400;
      font-size: 17px;
      color: #ccc5d3;
      line-height: 1.1;
    }

    .alert-cloud-top,
    .alert-cloud-bottom,
    .alert-moon,
    .alert-star {
      position: absolute;
      pointer-events: none;
    }

    /* Decoraciones: todas viven dentro de .alert-shape, así los % son
       relativos a la figura y los bordes se pueden anclar con 0% / 100%.
       Alto = 60px  ->  cada vértice se corre 0.3906 * 60 = 23.4px */

    /* nube superior: su trazo inferior se apoya sobre la línea superior */
    .alert-cloud-top {
      bottom: calc(100% - 1px);
      left: -5.8%;
      width: 36%;
      height: auto;
      z-index: 4;
    }

    /* nube inferior: su primer trazo se funde con la línea inferior */
    .alert-cloud-bottom {
      top: calc(100% - 2.5px);
      left: 73.5%;
      width: 25%;
      height: auto;
      z-index: 4;
    }

    /* luna a caballo del vértice inferior izquierdo, sobresaliendo por debajo */
    .alert-moon {
      bottom: -13px;
      left: -33px;
      width: 38px;
      height: auto;
      z-index: 3;
    }

    /* estrella centrada exactamente en el vértice superior derecho:
       23.4px del vértice + 9px de medio ancho de la estrella */
    .alert-star {
      top: -11.7px;
      right: -32.4px;
      width: 18px;
      height: auto;
      z-index: 3;
    }

    #status {
      position: fixed;
      top: 10px;
      right: 10px;
      font-family: 'Glacial Indifference', sans-serif;
      font-size: 13px;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(22, 19, 21, 0.75);
      border: 1px solid #584b8b;
      color: #a1719e;
      transition: all 0.3s;
    }
    #status.connected { color: #e8b979; }
    #status.error     { color: #ff6b6b; }

    /* Boton de autorizacion: solo aparece si falta el token de Twitch */
    #twitch-auth {
      position: fixed;
      top: 40px;
      right: 10px;
      display: none;
      font-family: 'Glacial Indifference', sans-serif;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(22, 19, 21, 0.9);
      border: 1px solid #e8b979;
      color: #e8b979;
      text-decoration: none;
    }
  </style>
</head>

    const container      = document.getElementById('chat-container');

    const userColorMap = {};

    function resolveColor(username, twitchColor) {
      if (twitchColor && twitchColor !== '#000000') return twitchColor;
      if (!userColorMap[username]) {
        const idx = [...username].reduce((a, c) => a + c.charCodeAt(0), 0) % palette.length;

      return userColorMap[username];

    function escapeHtml(str) {

        .replace(/</g, '&lt;')

    function buildMessageHtml(rawText, emotes) {

      parts.sort((a, b) => a.s - b.s);

      for (const r of parts) {
        if (r.s > cursor) html += escapeHtml(rawText.slice(cursor, r.s));
        html += `<img class="emote" src="https://static-cdn.jtvnw.net/emoticons/v2/${r.id}/default/dark/1.0" alt="${escapeHtml(r.name)}" title="${escapeHtml(r.name)}">`;
        cursor = r.e + 1;
      }
      if (cursor < rawText.length) html += escapeHtml(rawText.slice(cursor));
      return html;
    }

    function buildBadgesHtml(userBadges) {
      if (!userBadges) return '';
      if (Array.isArray(userBadges)) {
        return userBadges.filter(b => b && b.url)
          .map(b => `<img src="${b.url}" alt="${b.title || 'badge'}" title="${b.title || 'badge'}">`)
          .join('');
      }
      const known = {
        broadcaster: 'https://static-cdn.jtvnw.net/badges/v1/5527c58c-fb7d-422d-b71b-f309dcb85cc1/1',
        moderator:   'https://static-cdn.jtvnw.net/badges/v1/3267646d-33f0-4b17-b3df-f923a41db1d0/1',
        subscriber:  'https://static-cdn.jtvnw.net/badges/v1/5d9f2208-5dd8-11e7-8513-2ff4adfae661/1',
        vip:         'https://static-cdn.jtvnw.net/badges/v1/b817aba4-fad8-49e2-b88a-7cc744dfa6ec/1',
      };
      return Object.keys(userBadges).filter(k => known[k])
        .map(k => `<img src="${known[k]}" alt="${k}" title="${k}">`)
        .join('');
    }

    function enforceNoClipping() {
      const maxH = window.innerHeight * 0.92;
      while (container.scrollHeight > maxH && container.children.length > 1) {
        container.removeChild(container.firstChild);
      }
    }

    function addMessage(user, message, flags, extra) {
      const displayName = escapeHtml(extra.displayName || user);
      const badgesHtml  = buildBadgesHtml(extra.userBadges);
      const msgHtml     = buildMessageHtml(message, extra.messageEmotes);

      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper';
      wrapper.innerHTML = `
        <div class="username-label">
          <span class="name-star">✦</span>
          ${badgesHtml ? `<span class="badges">${badgesHtml}</span>` : ''}
          ${displayName}
        </div>
        <div class="bubble-row">
          <span class="rail">
            <span class="rail-dot"></span>
            <span class="rail-dot"></span>
            <span class="rail-line"></span>
          </span>
          <div class="bubble-wrap">
            <div class="bubble">
              <div class="msg-text">${msgHtml}</div>
            </div>
          </div>
        </div>
      `;

      container.appendChild(wrapper);

      while (container.children.length > CONFIG.maxMessages)
        container.removeChild(container.firstChild);

      enforceNoClipping();

      setTimeout(() => {
        wrapper.classList.add('fade-out');
        wrapper.addEventListener('animationend', () => wrapper.remove(), { once: true });
      }, CONFIG.messageLifeMs);
    }

    // ===== ALERTAS (followers, subs, bits, raids) =====

    function addAlert(title, subtitle) {
      const wrapper = document.createElement('div');
      wrapper.className = 'alert-wrapper';
      wrapper.innerHTML = `
        <div class="alert-shape">
          <div class="alert-skew"></div>
          <svg class="alert-cloud-top" viewBox="30 490 1370 460">${ICONS.nubeSuperior}</svg>
          <div class="alert-content">
            <div class="alert-title">${escapeHtml(title)}</div>
            <div class="alert-divider"></div>
            <div class="alert-user">${escapeHtml(subtitle)}</div>
          </div>
          <svg class="alert-cloud-bottom" viewBox="10 425 1420 590">${ICONS.nubeInferior}</svg>
          <svg class="alert-moon" viewBox="45 35 1350 1370">${ICONS.luna}</svg>
          <svg class="alert-star" viewBox="215 65 1010 1310">${ICONS.estrella}</svg>
        </div>
      `;

      alertContainer.appendChild(wrapper);

      while (alertContainer.children.length > 5)
        alertContainer.removeChild(alertContainer.firstChild);

      setTimeout(() => {
        wrapper.classList.add('fade-out');
        wrapper.addEventListener('animationend', () => wrapper.remove(), { once: true });
      }, CONFIG.alertLifeMs);
    }

    function atName(user, extra) {
      return '@' + (extra && extra.displayName ? extra.displayName : user);
    }

    ComfyJS.onChat = (user, message, flags, self, extra) => {
      if (self) return;
      addMessage(user, message, flags, extra);
    };

    ComfyJS.onCommand = (user, command, message, flags, extra) => {
      // !alerta [tipo]  -> dispara una alerta de prueba (solo streamer o mods),
      // util para verificar el overlay dentro de OBS, donde no hay consola.
      if (command.toLowerCase() === 'alerta') {
        if (!flags || !(flags.broadcaster || flags.mod)) return;
        testAlert((message || '').trim().toLowerCase() || 'follow');
        return;
      }
      addMessage(user, '!' + command + (message ? ' ' + message : ''), flags, extra);
    };

    // OJO: ComfyJS NO tiene evento de "follow". Los seguidores no viajan por IRC,
    // asi que no hay forma de detectarlos con esta libreria: haria falta Twitch
    // EventSub (token con scope moderator:read:followers) o un servicio tipo
    // Streamlabs. Los eventos de abajo si llegan por IRC y funcionan sin token.

    ComfyJS.onSub = (user, message, subTierInfo, extra) => {
      addAlert('NEW SUBSCRIBER', atName(user, extra));
    };

    ComfyJS.onResub = (user, message, streakMonths, cumulativeMonths, subTierInfo, extra) => {
      addAlert('NEW RESUB', atName(user, extra));
    };

    // El nombre correcto es onSubGift (no onGiftSub)
    ComfyJS.onSubGift = (gifterUser, streakMonths, recipientUser, senderCount, subTierInfo, extra) => {
      addAlert('GIFTED SUB', atName(gifterUser, extra));
    };

    // El nombre correcto es onSubMysteryGift (no onGiftSubCommunity)
    ComfyJS.onSubMysteryGift = (gifterUser, numbOfSubs, senderCount, subTierInfo, extra) => {
      addAlert(`GIFTED ${numbOfSubs} SUBS`, atName(gifterUser, extra));
    };

    ComfyJS.onCheer = (user, message, bits, flags, extra) => {
      addAlert(`${bits} BITS`, atName(user, extra));
    };

    ComfyJS.onRaid = (user, viewers, extra) => {
      addAlert('NEW RAID', `${atName(user, extra)} · ${viewers} viewers`);
    };

    ComfyJS.onConnected = () => {
      statusEl.textContent = '● conectado';
      statusEl.className = 'connected';
      setTimeout(() => { statusEl.style.opacity = '0'; }, 3000);
    };

    ComfyJS.onError = (err) => {
      statusEl.style.opacity = '1';
      statusEl.textContent = '● error de conexión';
      statusEl.className = 'error';
      console.error('ComfyJS error:', err);
    };

    ComfyJS.onReconnect = (reconnectCount) => {
      statusEl.style.opacity = '1';
      statusEl.textContent = `● reconectando… (${reconnectCount})`;
      statusEl.className = '';
    };

    ComfyJS.Init(CONFIG.channel);

    // ===== AVISOS DE SEGUIDOR: Twitch EventSub por WebSocket =====
    // Twitch no manda los follows por IRC, asi que ComfyJS no puede verlos.
    // Hay que abrir una conexion EventSub aparte y suscribirse a
    // channel.follow v2, que exige un user access token con el scope
    // moderator:read:followers. Todo ocurre en el navegador: no hace falta
    // servidor, por eso sirve en GitHub Pages.

    const TW        = CONFIG.twitch;
    const TW_SCOPE  = 'moderator:read:followers';
    const TOKEN_KEY = 'aliChatTwitchToken';
    const authEl    = document.getElementById('twitch-auth');

    function twStoreToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} }
    function twClearToken()  { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

    function twReadToken() {
      // 1) Vuelta del OAuth: el token llega en el fragmento de la URL.
      const hash = new URLSearchParams(location.hash.slice(1));
      const fromHash = hash.get('access_token');
      if (fromHash) {
        twStoreToken(fromHash);
        // Limpiamos la URL para no dejar el token a la vista.
        history.replaceState(null, '', location.pathname + location.search);
        return fromHash;
      }
      // 2) Pasado a mano por query: comodo para la fuente de OBS.
      const fromQuery = new URLSearchParams(location.search).get('token');
      if (fromQuery) return fromQuery;
      // 3) Guardado de una autorizacion anterior en este navegador.
      try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
    }

    function twAuthUrl() {
      return 'https://id.twitch.tv/oauth2/authorize?' + new URLSearchParams({
        client_id:     TW.clientId,
        redirect_uri:  TW.redirectUri,
        response_type: 'token',
        scope:         TW_SCOPE,
      });
    }

    function twShowAuthButton() {
      authEl.href = twAuthUrl();
      authEl.style.display = 'block';
    }

    // Devuelve { user_id, login, scopes } o null si el token ya no sirve.
    async function twValidate(token) {
      const res = await fetch('https://id.twitch.tv/oauth2/validate', {
        headers: { Authorization: 'OAuth ' + token },   // OJO: "OAuth", no "Bearer"
      });
      return res.ok ? res.json() : null;
    }

    async function twSubscribeFollows(sessionId, token, userId) {
      const res = await fetch('https://api.twitch.tv/helix/eventsub/subscriptions', {
        method: 'POST',
        headers: {
          Authorization:  'Bearer ' + token,
          'Client-Id':    TW.clientId,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          type:      'channel.follow',
          version:   '2',
          condition: { broadcaster_user_id: userId, moderator_user_id: userId },
          transport: { method: 'websocket', session_id: sessionId },
        }),
      });
      if (res.status !== 201) {
        throw new Error('suscripcion rechazada (' + res.status + '): ' + await res.text());
      }
    }

    function startEventSub(token, userId) {
      const vistos = new Set();        // Twitch puede reenviar: evitamos duplicados
      let ws = null, reintento = 0;

      function conectar(url, esReconexion) {
        const anterior = ws;
        const sock = new WebSocket(url || 'wss://eventsub.wss.twitch.tv/ws');
        if (!esReconexion) ws = sock;

        sock.onmessage = async (ev) => {
          let msg;
          try { msg = JSON.parse(ev.data); } catch (e) { return; }
          const meta = msg.metadata || {};

          // Twitch reenvia mensajes: descartamos los ya procesados.
          if (meta.message_id) {
            if (vistos.has(meta.message_id)) return;
            vistos.add(meta.message_id);
            if (vistos.size > 300) vistos.clear();
          }

          if (meta.message_type === 'session_welcome') {
            ws = sock;
            reintento = 0;
            // En una reconexion las suscripciones se conservan: no repetir.
            if (esReconexion) {
              if (anterior && anterior !== sock) anterior.close();
              return;
            }
            try {
              // Solo hay 10 segundos desde el welcome para suscribirse.
              await twSubscribeFollows(msg.payload.session.id, token, userId);
            } catch (e) {
              console.error('[EventSub]', e);
              statusEl.style.opacity = '1';
              statusEl.textContent = '● follows: error';
              statusEl.className = 'error';
            }
          }
          else if (meta.message_type === 'notification') {
            if (meta.subscription_type === 'channel.follow') {
              addAlert('NEW FOLLOWER', '@' + msg.payload.event.user_name);
            }
          }
          else if (meta.message_type === 'session_reconnect') {
            // 30 segundos para pasarse a la URL nueva sin perder eventos.
            conectar(msg.payload.session.reconnect_url, true);
          }
          else if (meta.message_type === 'revocation') {
            console.warn('[EventSub] suscripcion revocada:', msg.payload.subscription?.status);
            twClearToken();
            twShowAuthButton();
          }
        };

        sock.onclose = (e) => {
          if (sock !== ws) return;            // cierre del socket viejo tras reconectar
          if (e.code === 4003) return;        // se cerro por no suscribir: ya avisamos
          // Reintento con espera creciente, tope de 30 s.
          const espera = Math.min(30000, 1000 * Math.pow(2, reintento++));
          setTimeout(() => conectar(null, false), espera);
        };
      }

      conectar(null, false);
    }

    async function initFollowAlerts() {
      if (!TW.clientId) return;               // sin configurar: overlay normal, sin follows
      const token = twReadToken();
      if (!token) { twShowAuthButton(); return; }

      const info = await twValidate(token);
      if (!info) {                            // caducado o revocado
        twClearToken();
        twShowAuthButton();
        return;
      }
      if (!(info.scopes || []).includes(TW_SCOPE)) {
        console.error('[EventSub] al token le falta el scope ' + TW_SCOPE);
        twClearToken();
        twShowAuthButton();
        return;
      }
      authEl.style.display = 'none';
      startEventSub(token, info.user_id);
    }

    initFollowAlerts();

    // Helper de prueba desde la consola del navegador, sin necesidad de eventos reales:
    // testAlert('follow' | 'sub' | 'resub' | 'gift' | 'bits' | 'raid')
    window.testAlert = (type = 'follow') => {
      const map = {
        follow: () => addAlert('NEW FOLLOWER', '@testuser'),
        sub:    () => addAlert('NEW SUBSCRIBER', '@testuser'),
        resub:  () => addAlert('NEW RESUB', '@testuser'),
        gift:   () => addAlert('GIFTED SUB', '@testuser'),
        bits:   () => addAlert('100 BITS', '@testuser'),
        raid:   () => addAlert('NEW RAID', '@testuser · 42 viewers'),
      };
      (map[type] || map.follow)();
    };

    window.testMessage = (text = 'Hola esta es una prueba de chat') => {
      addMessage('testuser', text, {}, { displayName: 'Jozebas' });
    };
  </script>
</body>
</html>
