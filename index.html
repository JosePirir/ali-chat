<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Twitch Chat Overlay</title>
  <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Caveat:wght@700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      width: 460px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px 20px;
    }

    #chat-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: visible;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .msg-wrapper.fade-out {
      animation: fadeOut 0.35s ease-in forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.88) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-6px); }
    }

    .username-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #ccc5d3;
      margin-left: 4px;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
      text-shadow: 1px 1px 0 #161315, -1px -1px 0 #161315,
                   1px -1px 0 #161315, -1px 1px 0 #161315;
      letter-spacing: 0.02em;
    }

    .badges img {
      width: 15px;
      height: 15px;
      vertical-align: middle;
    }

    .bubble-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .star-left {
      color: #e8b979;
      font-size: 20px;
      line-height: 1;
      flex-shrink: 0;
      align-self: center;
    }

    .bubble-wrap {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .bubble {
      position: relative;
      background: linear-gradient(135deg, rgba(88,75,139,0.50), rgba(161,113,158,0.50));
      border: 2.5px solid #584b8b;
      border-radius: 6px;
      padding: 12px 14px;
      max-width: 400px;
      box-shadow: 3px 3px 0px rgba(88, 75, 139, 0.35);
    }

    .msg-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      color: #ccc5d3;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg-text img.emote {
      width: 22px;
      height: 22px;
      vertical-align: middle;
      margin: 0 1px;
    }

    .corner-svg {
      position: absolute;
      top: -14px;
      right: -14px;
      pointer-events: none;
    }

    #status {
      position: fixed;
      top: 10px;
      right: 10px;
      font-family: 'Caveat', cursive;
      font-size: 13px;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(22, 19, 21, 0.75);
      border: 1px solid #584b8b;
      color: #a1719e;
      transition: all 0.3s;
    }
    #status.connected { color: #e8b979; }
    #status.error     { color: #ff6b6b; }
  </style>
</head>
<body>

  <div id="status">● conectando…</div>
  <div id="chat-container"></div>

  <script>
    // ===== CONFIGURACIÓN =====
    const CONFIG = {
      channel:       '4LiiN4CL',  // <-- cambia esto
      maxMessages:   20,
      messageLifeMs: 30000,
    };
    // =========================

    const container = document.getElementById('chat-container');
    const statusEl  = document.getElementById('status');

    const palette = [
      '#9146ff','#00b5ad','#e91e8c','#ff6b35',
      '#00c8ff','#f5c518','#43e97b','#fa709a',
    ];
    const userColorMap = {};

    function resolveColor(username, twitchColor) {
      if (twitchColor && twitchColor !== '#000000') return twitchColor;
      if (!userColorMap[username]) {
        const idx = [...username].reduce((a, c) => a + c.charCodeAt(0), 0) % palette.length;
        userColorMap[username] = palette[idx];
      }
      return userColorMap[username];
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function buildMessageHtml(rawText, emotes) {
      if (!emotes || Object.keys(emotes).length === 0) return escapeHtml(rawText);
      const parts = [];
      for (const [id, positions] of Object.entries(emotes)) {
        for (const pos of positions) {
          const [s, e] = pos.split('-').map(Number);
          parts.push({ s, e, id, name: rawText.slice(s, e + 1) });
        }
      }
      parts.sort((a, b) => a.s - b.s);
      let html = '', cursor = 0;
      for (const r of parts) {
        if (r.s > cursor) html += escapeHtml(rawText.slice(cursor, r.s));
        html += `<img class="emote" src="https://static-cdn.jtvnw.net/emoticons/v2/${r.id}/default/dark/1.0" alt="${escapeHtml(r.name)}" title="${escapeHtml(r.name)}">`;
        cursor = r.e + 1;
      }
      if (cursor < rawText.length) html += escapeHtml(rawText.slice(cursor));
      return html;
    }

    function buildBadgesHtml(userBadges) {
      if (!userBadges) return '';
      if (Array.isArray(userBadges)) {
        return userBadges.filter(b => b && b.url)
          .map(b => `<img src="${b.url}" alt="${b.title || 'badge'}" title="${b.title || 'badge'}">`)
          .join('');
      }
      const known = {
        broadcaster: 'https://static-cdn.jtvnw.net/badges/v1/5527c58c-fb7d-422d-b71b-f309dcb85cc1/1',
        moderator:   'https://static-cdn.jtvnw.net/badges/v1/3267646d-33f0-4b17-b3df-f923a41db1d0/1',
        subscriber:  'https://static-cdn.jtvnw.net/badges/v1/5d9f2208-5dd8-11e7-8513-2ff4adfae661/1',
        vip:         'https://static-cdn.jtvnw.net/badges/v1/b817aba4-fad8-49e2-b88a-7cc744dfa6ec/1',
      };
      return Object.keys(userBadges).filter(k => known[k])
        .map(k => `<img src="${known[k]}" alt="${k}" title="${k}">`)
        .join('');
    }

    function addCornerSVG(bubble) {
      const w = bubble.offsetWidth;
      const h = bubble.offsetHeight;

      const pad = 14;
      const lineLen = 36;
      const lx = w;
      const ly = pad;
      const starOffsetY = 3;
      const sx = lx;
      const sy = ly + starOffsetY;

      const svgW = w + pad;
      const svgH = h + pad;

      const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('class','corner-svg');
      svg.setAttribute('width', svgW);
      svg.setAttribute('height', svgH);
      svg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);
      svg.style.width = svgW + 'px';
      svg.style.height = svgH + 'px';

      // línea horizontal
      const lh = document.createElementNS('http://www.w3.org/2000/svg','line');
      lh.setAttribute('x1', lx); lh.setAttribute('y1', ly);
      lh.setAttribute('x2', lx - lineLen); lh.setAttribute('y2', ly);
      lh.setAttribute('stroke','#e8b979'); lh.setAttribute('stroke-width','1.6'); lh.setAttribute('stroke-linecap','round');

      // puntos fin horizontal
      const dh1 = document.createElementNS('http://www.w3.org/2000/svg','circle');
      dh1.setAttribute('cx', lx - lineLen - 6); dh1.setAttribute('cy', ly);
      dh1.setAttribute('r','2'); dh1.setAttribute('fill','#e8b979');
      const dh2 = document.createElementNS('http://www.w3.org/2000/svg','circle');
      dh2.setAttribute('cx', lx - lineLen - 13); dh2.setAttribute('cy', ly);
      dh2.setAttribute('r','1.2'); dh2.setAttribute('fill','#e8b979'); dh2.setAttribute('opacity','0.6');

      // línea vertical
      const lv = document.createElementNS('http://www.w3.org/2000/svg','line');
      lv.setAttribute('x1', lx); lv.setAttribute('y1', ly);
      lv.setAttribute('x2', lx); lv.setAttribute('y2', ly + lineLen);
      lv.setAttribute('stroke','#e8b979'); lv.setAttribute('stroke-width','1.6'); lv.setAttribute('stroke-linecap','round');

      // puntos fin vertical
      const dv1 = document.createElementNS('http://www.w3.org/2000/svg','circle');
      dv1.setAttribute('cx', lx); dv1.setAttribute('cy', ly + lineLen + 6);
      dv1.setAttribute('r','2'); dv1.setAttribute('fill','#e8b979');
      const dv2 = document.createElementNS('http://www.w3.org/2000/svg','circle');
      dv2.setAttribute('cx', lx); dv2.setAttribute('cy', ly + lineLen + 13);
      dv2.setAttribute('r','1.2'); dv2.setAttribute('fill','#e8b979'); dv2.setAttribute('opacity','0.6');

      // estrella
      const starEl = document.createElementNS('http://www.w3.org/2000/svg','text');
      starEl.setAttribute('x', sx); starEl.setAttribute('y', sy);
      starEl.setAttribute('text-anchor','middle'); starEl.setAttribute('dominant-baseline','middle');
      starEl.setAttribute('font-size','26'); starEl.setAttribute('fill','#e8b979');
      starEl.setAttribute('font-family','Georgia,serif');
      starEl.textContent = '✦';

      svg.appendChild(lh); svg.appendChild(lv);
      svg.appendChild(dh1); svg.appendChild(dh2);
      svg.appendChild(dv1); svg.appendChild(dv2);
      svg.appendChild(starEl);

      bubble.parentElement.appendChild(svg);
    }

    function enforceNoClipping() {
      const maxH = window.innerHeight * 0.92;
      while (container.scrollHeight > maxH && container.children.length > 1) {
        container.removeChild(container.firstChild);
      }
    }

    function addMessage(user, message, flags, extra) {
      const displayName = escapeHtml(extra.displayName || user);
      const badgesHtml  = buildBadgesHtml(extra.userBadges);
      const msgHtml     = buildMessageHtml(message, extra.messageEmotes);

      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper';
      wrapper.innerHTML = `
        <div class="username-label">
          ${badgesHtml ? `<span class="badges">${badgesHtml}</span>` : ''}
          ${displayName}
        </div>
        <div class="bubble-row">
          <span class="star-left">✦</span>
          <div class="bubble-wrap">
            <div class="bubble">
              <div class="msg-text">${msgHtml}</div>
            </div>
          </div>
        </div>
      `;

      container.appendChild(wrapper);

      while (container.children.length > CONFIG.maxMessages)
        container.removeChild(container.firstChild);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const bubble = wrapper.querySelector('.bubble');
          if (bubble) addCornerSVG(bubble);
        });
      });

      enforceNoClipping();

      setTimeout(() => {
        wrapper.classList.add('fade-out');
        wrapper.addEventListener('animationend', () => wrapper.remove(), { once: true });
      }, CONFIG.messageLifeMs);
    }

    ComfyJS.onChat = (user, message, flags, self, extra) => {
      if (self) return;
      addMessage(user, message, flags, extra);
    };

    ComfyJS.onCommand = (user, command, message, flags, extra) => {
      addMessage(user, '!' + command + (message ? ' ' + message : ''), flags, extra);
    };

    ComfyJS.onConnected = () => {
      statusEl.textContent = '● conectado';
      statusEl.className = 'connected';
      setTimeout(() => { statusEl.style.opacity = '0'; }, 3000);
    };

    ComfyJS.onError = (err) => {
      statusEl.style.opacity = '1';
      statusEl.textContent = '● error de conexión';
      statusEl.className = 'error';
      console.error('ComfyJS error:', err);
    };

    ComfyJS.onReconnect = (reconnectCount) => {
      statusEl.style.opacity = '1';
      statusEl.textContent = `● reconectando… (${reconnectCount})`;
      statusEl.className = '';
    };

    ComfyJS.Init(CONFIG.channel);
  </script>
</body>
</html>
